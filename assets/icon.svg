<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Private Browser app icon (fills the square: Windows, Linux, in-app use).
       Colors: sage #9CAF88 (with a gentle light-to-deep sage gradient for
       depth) and off-white #F7F5EF. The mark is a shield (privacy) whose
       curved cut reads as the vein of a leaf (calm, natural). -->
  <defs>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9BB96"/>
      <stop offset="0.5" stop-color="#9CAF88"/>
      <stop offset="1" stop-color="#8FA27B"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4F5E42" flood-opacity="0.28"/>
    </filter>
    <mask id="vein">
      <rect width="1024" height="1024" fill="white"/>
      <path d="M512 800 C506 640 528 500 620 396" fill="none" stroke="black" stroke-width="40" stroke-linecap="round"/>
    </mask>
  </defs>
  <g transform="translate(512 512) scale(1.145631067961165) translate(-512 -512)">
    <!-- Rounded tile -->
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sage)"/>
    <!-- Leaf-shield -->
    <g filter="url(#lift)">
      <path fill="#F7F5EF" mask="url(#vein)" d="M496 272 Q512 262 528 272 C580 302 640 318 702 322 C716 323 726 334 726 348 L726 470 C726 612 636 714 524 768 Q512 774 500 768 C388 714 298 612 298 470 L298 348 C298 334 308 323 322 322 C384 318 444 302 496 272 Z"/>
    </g>
  </g>
</svg>
